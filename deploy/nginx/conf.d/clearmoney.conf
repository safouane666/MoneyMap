# HTTP front door. For TLS, copy ssl.conf.example → ssl.conf and mount certs under deploy/certs/.

server {
  listen 80;
  server_name _;

  # API health (Compose verify + uptime checks)
  location = /health {
    proxy_pass http://cm_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Better Auth: API mounts basePath /cm-api/auth — keep the full path.
  location /cm-api/auth {
    proxy_pass http://cm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  # All other /cm-api/* routes live at the API root (web proxy strips /cm-api the same way).
  # /cm-api/spaces → /spaces, /cm-api/me → /me, etc.
  location /cm-api/ {
    rewrite ^/cm-api/(.*)$ /$1 break;
    proxy_pass http://cm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  # Next.js app (and its /cm-api catch-all if a request somehow hits web directly).
  location / {
    proxy_pass http://cm_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
