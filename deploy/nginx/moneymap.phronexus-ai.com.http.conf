# Legacy HTTP host — redirect to the new Penny domain (HTTP bootstrap / ACME only).

server {
    listen 80;
    listen [::]:80;
    server_name moneymap.phronexus-ai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://penny.phronexus-ai.com$request_uri;
    }
}
