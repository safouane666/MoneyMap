# Legacy host — permanent redirect to penny.phronexus-ai.com.
# Keep until bookmarks / old mobile builds stop using moneymap.*.

server {
    listen 80;
    listen [::]:80;
    server_name moneymap.phronexus-ai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://penny.phronexus-ai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name moneymap.phronexus-ai.com;

    ssl_certificate /etc/letsencrypt/live/moneymap.phronexus-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moneymap.phronexus-ai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://penny.phronexus-ai.com$request_uri;
    }
}
