# ACME-only bootstrap for penny.phronexus-ai.com (no upstreams — avoids clash with moneymap.conf).
# Replace with penny.phronexus-ai.com.conf after certbot succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name penny.phronexus-ai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Penny ACME bootstrap';
        add_header Content-Type text/plain;
    }
}
