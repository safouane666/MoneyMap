services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clearmoney
      POSTGRES_PASSWORD: clearmoney
      POSTGRES_DB: clearmoney
    ports:
      - '0.0.0.0:5433:5432'
    volumes:
      - cm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clearmoney']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '0.0.0.0:9000:9000'
      - '0.0.0.0:9001:9001'
    volumes:
      - cm_minio:/data

volumes:
  cm_pg:
  cm_minio:
