# Production overlay — use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Local docker-compose.yml (Postgres + MinIO with host ports) stays unchanged for day-to-day dev.
# This overlay adds api/web/worker/nginx and keeps DB/storage internal-only.

services:
  postgres:
    # Prod stack: no host publish — only nginx faces the network.
    ports: !reset []

  minio:
    ports: !reset []

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: '3011'
      PORT: '3011'
      DATABASE_URL: ${DATABASE_URL:-postgresql://clearmoney:clearmoney@postgres:5432/clearmoney}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-clearmoney}
      S3_REGION: ${S3_REGION:-us-east-1}
      WEB_URL: ${WEB_URL:-http://localhost}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      EXTRA_WEB_ORIGINS: ${EXTRA_WEB_ORIGINS:-}
      BETA_FREE_MODE: ${BETA_FREE_MODE:-true}
      BILLING_MODE: ${BILLING_MODE:-free}
      BILLING_ENABLED: ${BILLING_ENABLED:-true}
      DEFAULT_PLAN: ${DEFAULT_PLAN:-free}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - '3011'
    restart: unless-stopped
    networks:
      - default

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://clearmoney:clearmoney@postgres:5432/clearmoney}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-clearmoney}
      S3_REGION: ${S3_REGION:-us-east-1}
      AI_API_KEY: ${AI_API_KEY:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /cm-api
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: '8259'
      HOSTNAME: 0.0.0.0
      # Server-side proxy / SSR → API on the Docker network
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3011}
      WEB_URL: ${WEB_URL:-http://localhost}
    depends_on:
      api:
        condition: service_started
    expose:
      - '8259'
    restart: unless-stopped
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # Mount real certs on the VPS (or leave empty for HTTP-only local smoke).
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - default
